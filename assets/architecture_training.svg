<svg xmlns="http://www.w3.org/2000/svg" width="720" height="660" viewBox="0 0 720 660" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t{font-size:15px;font-weight:600;text-anchor:middle;dominant-baseline:central}
      .s{font-size:12.5px;text-anchor:middle;dominant-baseline:central}
      .l{stroke:#5F5E5A;stroke-width:1.3;fill:none}
      .gray rect{fill:#F1EFE8;stroke:#888780} .gray .t{fill:#2C2C2A} .gray .s{fill:#5F5E5A}
      .teal rect{fill:#E1F5EE;stroke:#0F6E56} .teal .t{fill:#085041} .teal .s{fill:#0F6E56}
      .coral rect{fill:#FAECE7;stroke:#993C1D} .coral .t{fill:#712B13} .coral .s{fill:#993C1D}
    </style>
  </defs>
  <rect width="720" height="660" fill="#FFFFFF"/>
  <text x="360" y="22" class="s" fill="#5F5E5A">Training, one ensemble member (same recipe for EfficientNet-B4, ConvNeXt-Tiny, Swin-Tiny)</text>

  <g class="gray"><rect x="260" y="40" width="200" height="56" rx="8"/><text x="360" y="58" class="t">Input image</text><text x="360" y="78" class="s">224×224 face crop</text></g>
  <path class="l" d="M360 96 V108 H255 V122" marker-end="url(#a)"/><path class="l" d="M360 108 H465 V122" marker-end="url(#a)"/>

  <g class="gray"><rect x="170" y="124" width="170" height="56" rx="8"/><text x="255" y="142" class="t">View 1</text><text x="255" y="162" class="s">random augmentation</text></g>
  <g class="gray"><rect x="380" y="124" width="170" height="56" rx="8"/><text x="465" y="142" class="t">View 2</text><text x="465" y="162" class="s">random augmentation</text></g>
  <path class="l" d="M255 180 V218" marker-end="url(#a)"/><path class="l" d="M465 180 V218" marker-end="url(#a)"/>

  <g class="teal"><rect x="160" y="220" width="400" height="56" rx="8"/><text x="360" y="238" class="t">Backbone: ImageNet weights frozen + LoRA (r = 8)</text><text x="360" y="258" class="s">EfficientNet-B4  |  ConvNeXt-Tiny  |  Swin-Tiny   (shared by both views)</text></g>
  <path class="l" d="M360 276 V314" marker-end="url(#a)"/>

  <g class="gray"><rect x="250" y="316" width="220" height="56" rx="8"/><text x="360" y="334" class="t">Pooled features h</text><text x="360" y="354" class="s">1792-d (B4) or 768-d</text></g>
  <path class="l" d="M360 372 V392 H200 V412" marker-end="url(#a)"/><path class="l" d="M360 392 H520 V412" marker-end="url(#a)"/>

  <g class="teal"><rect x="60" y="414" width="280" height="56" rx="8"/><text x="200" y="432" class="t">MLP classifier head</text><text x="200" y="452" class="s">Dropout 0.4 → Linear → 1 logit → P(fake)</text></g>
  <g class="coral"><rect x="380" y="414" width="280" height="56" rx="8"/><text x="520" y="432" class="t">Projection head</text><text x="520" y="452" class="s">Linear → ReLU → Linear → 128-d, L2-norm</text></g>
  <path class="l" d="M200 470 V508" marker-end="url(#a)"/><path class="l" d="M520 470 V508" marker-end="url(#a)"/>

  <g class="teal"><rect x="60" y="510" width="280" height="56" rx="8"/><text x="200" y="528" class="t">BCE (smoothing 0.05) + consistency</text><text x="200" y="548" class="s">consistency weight 1.0</text></g>
  <g class="coral"><rect x="380" y="510" width="280" height="56" rx="8"/><text x="520" y="528" class="t">Supervised contrastive loss</text><text x="520" y="548" class="s">weight 0.1, temperature 0.1</text></g>

  <rect x="190" y="606" width="16" height="16" rx="3" fill="#E1F5EE" stroke="#0F6E56"/><text x="214" y="614" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">Kept for inference</text>
  <rect x="380" y="606" width="16" height="16" rx="3" fill="#FAECE7" stroke="#993C1D"/><text x="404" y="614" font-size="12.5" fill="#2C2C2A" dominant-baseline="central">Training only, dropped at export</text>
</svg>
